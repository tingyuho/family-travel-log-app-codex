appId: com.tyhotw.familytravellogmobile
---
- launchApp
- runFlow:
    when:
      visible: "Logout"
    commands:
      - tapOn: "Logout"
- assertVisible:
    id: "auth-user-id"
- tapOn:
    id: "auth-user-id"
- inputText: ${TEST_USER_ID}
- tapOn:
    id: "auth-password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible: "Logout"
    timeout: 60000
- tapOn: "Trips tab"
- assertVisible: "Logout"
- tapOn: "Map tab"
- assertVisible: "Logout"
- tapOn: "Logout"
- assertVisible:
    id: "auth-user-id"
