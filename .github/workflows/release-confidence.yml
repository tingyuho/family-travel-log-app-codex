name: Release confidence

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: release-confidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travel_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: travel_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_test -d travel_contract_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify disposable PostgreSQL contract
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://travel_test:disposable-ci-password@localhost:5432/travel_contract_test
        run: python backend/scripts/run_tests.py backend/tests/test_postgres_contract.py

  browser-ios-backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.txt
      - name: Run release confidence gate
        run: npm run release:check
