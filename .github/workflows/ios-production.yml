name: iOS production build

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: Build only or build and submit to App Store Connect
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - build-and-submit

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate iOS release configuration
        run: npm run release:ios:preflight
      - name: Configure App Store Connect submission
        if: inputs.release_action == 'build-and-submit'
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: npm run release:ios:configure-submit
      - name: Validate App Store Connect submission
        if: inputs.release_action == 'build-and-submit'
        env:
          REQUIRE_EAS_SUBMIT_ID: "1"
        run: npm run release:ios:preflight
      - name: Start production EAS build
        if: inputs.release_action == 'build-only'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run mobile:build:ios:production -- --non-interactive --no-wait
      - name: Build and submit to App Store Connect
        if: inputs.release_action == 'build-and-submit'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run mobile:build:ios:production -- --non-interactive --auto-submit
